<style>
/* ============ CIMIENTOS (paso 1) ============ */
@font-face {
  font-family: "Oswald RR";
  src: url("fonts/Oswald.ttf") format("truetype");
  font-weight: 200 700;
  font-display: block;
}
@font-face { font-family: "Kallpa";      src: url("fonts/Kallpa-Bold.otf"); }
@font-face { font-family: "Interstice";  src: url("fonts/Interstice-Sevra.otf"); }
@font-face { font-family: "Interstice Thin";    src: url("fonts/Interstice-Thin.otf"); }
@font-face { font-family: "Interstice Regular"; src: url("fonts/Interstice-Regular.otf"); }
@font-face { font-family: "Interstice Bold";    src: url("fonts/Interstice-Bold.otf"); }
@font-face { font-family: "Ranger";      src: url("fonts/Ranger-CondensedBold.otf"); }
@font-face { font-family: "Cameno";      src: url("fonts/Cameno-ExpandedBold.ttf"); }
@font-face { font-family: "Keta";        src: url("fonts/Keta.ttf"); }
@font-face { font-family: "Blockz";      src: url("fonts/Blockz.otf"); }
@font-face { font-family: "Green Pulse"; src: url("fonts/GreenPulse.otf"); }
:root {
  --bl: 10.186px;
  --margin: var(--bl);
  --gutter: var(--bl);
  --ink: #231f20;
  --paper: #ffffff;
  --block: #e5e4e4;          /* gris claro: todos los bloques */
  --block-active: #bdbcbc;   /* gris oscuro: hover, seleccionado, barra */
  --icon: #aaa8a8;           /* gris del icono de la barra */
  --chamfer: 6px;
  --hole: 4px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { -webkit-font-smoothing: antialiased; font-family: "Oswald RR", sans-serif; }

.oswald-01, .oswald-02, .oswald-03 {
  font-weight: 400; letter-spacing: -0.025em; margin: 0;
  position: relative; top: calc(0.358 * var(--fs) - var(--lh) / 2);
  font-size: var(--fs); line-height: var(--lh);
}
.oswald-01 { --fs: 12.573px; --lh: calc(var(--bl) * 2); }
.oswald-02 { --fs: 25.147px; --lh: calc(var(--bl) * 3); }
.oswald-03 { --fs: 50.285px; --lh: calc(var(--bl) * 5); }

/* Etiqueta de botón en OSWALD 02: la mayúscula mide 2 líneas base
   y se centra en el bloque (como el centrado vertical de InDesign). */
.label {
  --fs: 25.147px; --lh: calc(var(--bl) * 2);
  font-size: var(--fs); line-height: var(--lh); height: var(--lh);
  letter-spacing: -0.025em; white-space: nowrap;
  position: relative; top: calc(0.358 * var(--fs) - var(--lh) / 2);
}

.block {
  --dot: radial-gradient(circle, var(--ink) calc(var(--hole)/2 - .3px), transparent calc(var(--hole)/2 + .3px));
  background:
    radial-gradient(circle at var(--chamfer) var(--chamfer), var(--ink) calc(var(--hole)/2 - .3px), transparent calc(var(--hole)/2 + .3px)),
    radial-gradient(circle at calc(100% - var(--chamfer)) var(--chamfer), var(--ink) calc(var(--hole)/2 - .3px), transparent calc(var(--hole)/2 + .3px)),
    radial-gradient(circle at var(--chamfer) calc(100% - var(--chamfer)), var(--ink) calc(var(--hole)/2 - .3px), transparent calc(var(--hole)/2 + .3px)),
    radial-gradient(circle at calc(100% - var(--chamfer)) calc(100% - var(--chamfer)), var(--ink) calc(var(--hole)/2 - .3px), transparent calc(var(--hole)/2 + .3px)),
    var(--fill, var(--block));
  clip-path: polygon(var(--chamfer) 0, calc(100% - var(--chamfer)) 0, 100% var(--chamfer), 100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%, var(--chamfer) 100%, 0 calc(100% - var(--chamfer)), 0 var(--chamfer));
}

/* ============ PASO 2 · MENÚ ============ */
.site { padding: var(--margin) var(--margin) 0; }

/* Zona plegable: su altura es siempre un múltiplo de la línea base. */
.menu-area {
  height: var(--area, 0px);
  overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end;
}


/* Logo: entra por detrás de los botones cuando bajas del todo. */
.logo-wrap {
  flex: none; height: var(--logo-visible, 0px); overflow: hidden;
  display: flex; align-items: flex-end;
}
.logo-wrap a { display: block; width: 100%; }
.logo { display: block; width: 100%; height: var(--logo-h); flex: none; color: var(--ink); }
.logo-gap { flex: none; height: var(--logo-gap, 0px); }

/* Botones: 6 en 12 columnas (2 col cada uno). Tablet 3, móvil 2. */
.buttons {
  flex: none;
  display: grid;
  grid-template-columns: repeat(var(--per-row), minmax(0, 1fr));
  column-gap: var(--gutter);
  row-gap: var(--bl);
  padding-bottom: var(--bl);           /* 1 línea hasta la barra */
  --per-row: 6;
}
@media (max-width: 900px) { .buttons { --per-row: 3; } }
@media (max-width: 560px) { .buttons { --per-row: 2; } }

.btn {
  height: var(--btn-h, calc(var(--bl) * 5));
  display: flex; align-items: center; justify-content: center;
  color: var(--ink); text-decoration: none;
  border: 0; padding: 0; font: inherit; cursor: pointer;
}
.btn:hover, .btn:focus-visible { --fill: var(--block-active); outline: none; }
.btn.is-active { --fill: var(--block-active); }
.has-active .btn:not(.is-active) .label { color: var(--block-active); }
.has-active .btn:not(.is-active):hover .label { color: var(--ink); }

/* Barra para arrastrar: 12 col × 3 líneas */
.bar {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: calc(var(--bl) * 3);
  border: 0; padding: 0; cursor: grab; touch-action: none;
  user-select: none; -webkit-user-select: none;
}
.bar:hover, .bar:focus-visible, body.dragging .bar { --fill: var(--block-active); outline: none; }
body.dragging, body.dragging * { cursor: grabbing !important; }
.burger { width: 20px; display: grid; gap: 4.6px; }
.burger i { display: block; height: 1.4px; border-radius: 1px; background: var(--icon); }
.bar:hover .burger i, body.dragging .burger i { background: var(--ink); }

/* Catálogo: tarjetas 4 col × 47 líneas con la muestra de cada tipografía
   (texto alineado abajo y centrado, como en InDesign) */
.content {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
  column-gap: var(--gutter); row-gap: var(--bl);
  padding: var(--bl) 0 var(--bl);
}
.card {
  grid-column: span 4; height: var(--card-h, calc(var(--bl) * 47));
  display: flex; align-items: flex-end; justify-content: center;
  container-type: inline-size; overflow: hidden;
  color: var(--ink); text-decoration: none;
}
.card:hover { --fill: var(--block-active); }
/* tamaño del InDesign; si la tarjeta es más estrecha que 490 px, se reduce en proporción */
.specimen { --shift: 0px; transform: translateY(var(--shift)); line-height: normal; white-space: nowrap; font-size: calc(var(--s) / 4.904 * 1cqw); }

/* Pie: R R F © (2 col × 25 líneas) + 4 enlaces (2 col × 12) */
.footer {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-auto-rows: var(--bl); column-gap: var(--gutter); row-gap: 0;
  padding-bottom: var(--bl);
}
/* La letra grande: Oswald Bold, mayúscula de 21 líneas, 2 líneas arriba y 2 abajo */
.footer .big { grid-column: span 2; grid-row: 1 / span 25; display: flex; align-items: flex-start; justify-content: center; padding-top: calc(var(--bl) * 2); overflow: hidden; }
.footer .big span {
  font-weight: 700;
  --lh: calc(var(--bl) * 21); --fs: calc(var(--lh) / 0.81);
  font-size: var(--fs); line-height: var(--lh); height: var(--lh);
  letter-spacing: -0.025em; position: relative; top: calc(0.358 * var(--fs) - var(--lh) / 2);
}
.footer .link { grid-column: span 2; display: flex; align-items: center; justify-content: center; color: var(--ink); text-decoration: none; }
.footer .link:hover { --fill: var(--block-active); }
.footer .l1, .footer .l2 { grid-row: 1 / span 12; }
.footer .l3, .footer .l4 { grid-row: 14 / span 12; }
@media (max-width: 900px) {
  .footer .big { grid-column: span 3; }
  .footer .link { grid-column: span 6; }
  .footer .l1, .footer .l2 { grid-row: 27 / span 12; }
  .footer .l3, .footer .l4 { grid-row: 40 / span 12; }
}
@media (max-width: 900px) { .card { grid-column: span 6; } }
@media (max-width: 560px) { .card { grid-column: span 12; } }

/* Caritas: en cada cruce de medianiles entre bloques; giran con el scroll */
.body-wrap { position: relative; }
.smiley {
  position: absolute; width: 16.1px; height: 16.1px; margin: -8.05px 0 0 -8.05px;
  z-index: 5; pointer-events: none;
  transform: rotate(var(--spin, 0deg)); transform-origin: 50% 50%; will-change: transform;
  line-height: 0;
}
.smiley svg { display: block; width: 100%; height: 100%; }

/* ============ PASO 3 · PÁGINA DE TIPOGRAFÍA ============ */
.view-type { display: none; }
body.is-type .view-type { display: block; }
body.is-type #bodyWrap { display: none; }
/* dentro de una tipografía la barra va en gris oscuro (tu 30 %) */
body.is-type .bar { --fill: var(--block-active); }
body.is-type .bar .burger i { background: var(--ink); }

/* Marco principal: ocupa todo lo que queda de pantalla, con margen en todos los lados */
.hero {
  margin-top: var(--bl);
  height: max(calc(var(--bl) * 30), calc(100svh - var(--header-h, 0px) - var(--bl) * 2));
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.hero-name { white-space: nowrap; line-height: 1; font-size: var(--hero-fs, 300px); animation: fade-in .45s .1s both; }
@keyframes fade-in { from { opacity: 0; transform: translateY(var(--bl)); } to { opacity: 1; transform: none; } }

/* Barra separadora de sección (3 líneas, gris oscuro, rótulo pequeño) */
.section-bar {
  --fill: var(--block-active);
  height: calc(var(--bl) * 3); margin-top: var(--bl);
  display: flex; align-items: center; justify-content: center;
}
.soon { height: calc(var(--bl) * 23); margin: var(--bl) 0; display: flex; align-items: center; justify-content: center; color: var(--block-active); }

/* Rótulo de barra en OSWALD 01 (mayúscula de 1 línea, centrada) */
.label-01 {
  --fs: 12.573px; --lh: var(--bl);
  font-size: var(--fs); line-height: var(--lh); height: var(--lh); white-space: nowrap;
  letter-spacing: -0.025em; position: relative; top: calc(0.358 * var(--fs) - var(--lh) / 2);
}
/* Texto corrido en OSWALD 02 / 03 (líneas sobre la línea base) */
.t02, .t03 { letter-spacing: -0.025em; position: relative; top: calc(0.358 * var(--fs) - var(--lh) / 2); font-size: var(--fs); line-height: var(--lh); margin: 0; }
.t02 { --fs: 25.147px; --lh: calc(var(--bl) * 3); }
.t03 { --fs: 50.285px; --lh: calc(var(--bl) * 5); }
.t02 a, .t03 a { color: inherit; text-decoration: none; }
.t02 a:hover, .t03 a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.arrow { font-family: system-ui, sans-serif; font-weight: 300; font-size: .8em; }

/* Bloque blanco (con tornillos), como tus cajas en Papel */
.white { --fill: var(--paper); }

/* INFO: nombre, autor, escuela (12 col × 23 líneas) */
.info {
  margin-top: var(--bl); height: calc(var(--bl) * 23);
  display: grid; grid-template-rows: repeat(23, var(--bl)); justify-items: center; text-align: center;
}
.info .i-name   { grid-row: 4 / span 4; }
.info .i-credit { grid-row: 11 / span 6; }
.info .i-school { grid-row: 19 / span 2; }

/* Botones de características: se ensanchan al pasar por encima */
.features {
  margin-top: var(--bl); height: calc(var(--bl) * 11);
  display: flex; align-items: center; justify-content: center; gap: var(--gutter);
  container-type: inline-size; padding: 0 var(--bl);
}
.feat {
  --col: calc((100cqw - var(--bl) * 2 - 11 * var(--gutter)) / 12);
  --half: calc((var(--col) - var(--gutter)) / 2);
  --fill: var(--block);
  position: relative; flex: none; height: calc(var(--bl) * 5);
  width: var(--w-now, var(--half));
  display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; overflow: hidden;
  transition: width .35s var(--ease);
  cursor: default;
}
.feat.wide1 { --w-now: var(--col); }
.feat .label { grid-area: 1 / 1; transition: opacity .2s; }
.feat .long { opacity: 0; }
.feat:hover, .feat:focus-visible { --fill: var(--block-active); outline: none; }

/* GALERÍA: foto 6 col × 41 líneas + texto 6 col × 23 líneas; si hay más de dos, se desliza */
.gallery {
  margin-top: var(--bl);
  display: flex; gap: var(--gutter); overflow-x: auto; scroll-snap-type: x mandatory;
  scrollbar-width: none;
}
.gallery::-webkit-scrollbar { display: none; }
.g-item { flex: none; width: calc((100% - var(--gutter)) / 2); scroll-snap-align: start; display: grid; row-gap: var(--bl); min-width: 0; }
.g-img {
  height: calc(var(--bl) * 41); overflow: hidden; background: var(--ink);
  clip-path: polygon(var(--chamfer) 0, calc(100% - var(--chamfer)) 0, 100% var(--chamfer), 100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%, var(--chamfer) 100%, 0 calc(100% - var(--chamfer)), 0 var(--chamfer));
}
.g-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.g-text { height: calc(var(--bl) * 23); display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 calc(var(--bl) * 2); }
@media (max-width: 760px) { .g-item { width: 100%; } .g-text { height: auto; min-height: calc(var(--bl) * 23); padding: calc(var(--bl) * 2) calc(var(--bl) * 2); } }
@media (max-width: 760px) { .t03 { --fs: 37.7px; } }

/* PROBADOR: área 12 col × 47 líneas + fila de controles de 5 líneas */
.tester-area {
  margin-top: var(--bl); height: calc(var(--bl) * 47);
  display: flex; align-items: center; overflow: hidden; padding: 0 calc(var(--bl) * 3);
}
.tester-text {
  width: 100%; outline: none; white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 100%; overflow: hidden; caret-color: var(--ink);
}
.controls {
  margin-top: var(--bl);
  display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); column-gap: var(--gutter);
  height: calc(var(--bl) * 5);
}
.ctl { height: calc(var(--bl) * 5); display: flex; align-items: center; justify-content: center; gap: var(--bl); border: 0; padding: 0 calc(var(--bl) * 1.5); font: inherit; color: var(--ink); cursor: pointer; min-width: 0; user-select: none; -webkit-user-select: none; }
.ctl:hover, .ctl.on { --fill: var(--block-active); }
.ctl .val { color: var(--block-active); font-variant-numeric: tabular-nums; }
.ctl:hover .val, .ctl.scrub .val { color: var(--ink); }
.ctl.dim .label { color: var(--block-active); }
.ctl.dim:hover .label, .ctl.dim.on .label { color: var(--ink); }
.c-weight { grid-column: 1 / span 4; position: relative; }
.c-size   { grid-column: 5 / span 6; justify-content: space-between; cursor: default; }
.c-lead   { grid-column: 11 / span 2; cursor: ew-resize; justify-content: flex-start; }
.c-track  { grid-column: 13 / span 2; cursor: ew-resize; justify-content: flex-start; }
.c-abc    { grid-column: 16; } .c-num { grid-column: 17; } .c-sym { grid-column: 18; } .c-acc { grid-column: 19; } .c-enye { grid-column: 20; }
.c-left   { grid-column: 22; } .c-center { grid-column: 23; } .c-right { grid-column: 24; }
.c-abc, .c-num, .c-sym, .c-acc, .c-enye, .c-left, .c-center, .c-right { padding: 0; }
.lead-ico { text-decoration: overline underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
/* deslizador con tirador octogonal */
.slider { position: relative; flex: 1; height: calc(var(--bl) * 2); cursor: pointer; touch-action: none; }
.slider::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--block-active); }
.knob { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; background: var(--ink);
  clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
.align-ico { width: 22px; display: flex; flex-direction: column; gap: 3.5px; }
.align-ico i { display: block; height: 1px; background: var(--block-active); }
.ctl.on .align-ico i, .ctl:hover .align-ico i { background: var(--ink); }
/* desplegable de pesos (se abre hacia arriba) */
.controls { position: relative; }
.w-menu { position: absolute; left: 0; width: var(--w-menu-w, 200px); bottom: calc(100% + var(--bl)); display: none; flex-direction: column-reverse; gap: var(--bl); z-index: 30; }
.controls.open .w-menu { display: flex; }
.controls.open .c-weight { --fill: var(--block-active); }
.w-opt { height: calc(var(--bl) * 5); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.w-opt:hover, .w-opt.cur { --fill: var(--block-active); }
@media (max-width: 900px) {
  .controls { height: auto; row-gap: var(--bl); grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .c-weight { grid-column: 1 / span 4; } .c-size { grid-column: 5 / span 8; }
  .c-lead { grid-column: 1 / span 3; } .c-track { grid-column: 4 / span 3; }
  .c-abc { grid-column: 7; } .c-num { grid-column: 8; } .c-sym { grid-column: 9; } .c-acc { grid-column: 10; } .c-enye { grid-column: 11; }
  .c-left { grid-column: 1 / span 2; } .c-center { grid-column: 3 / span 2; } .c-right { grid-column: 5 / span 2; }
}

/* GLIFOS: izquierda, rejilla con su propio scroll; derecha, glifo grande + pestaña de peso.
   Ocupa todo el alto de la pantalla, con margen. */
.glyphs {
  margin-top: var(--bl);
  height: max(calc(var(--bl) * 50), calc(100svh - var(--bl) * 6));
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter);
}
.g-list {
  grid-column: 1 / span 6; overflow-y: auto; overscroll-behavior: auto; scrollbar-width: none;
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: calc(var(--bl) * 11);
  gap: var(--bl) var(--gutter); align-content: start;
}
.g-list::-webkit-scrollbar { display: none; }
.g-cell { display: flex; align-items: center; justify-content: center; color: var(--block-active); font-size: 60px; line-height: 1; white-space: nowrap; overflow: hidden; cursor: default; transition: color .12s; }
.g-cell.cur { color: var(--ink); }
.g-side { grid-column: 7 / span 6; display: flex; flex-direction: column; gap: var(--bl); min-height: 0; position: relative; }
.g-big { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; container-type: size; }
.g-big span { font-size: min(500px, 60cqh, 70cqw); line-height: 1; white-space: nowrap; }
.g-tab { height: calc(var(--bl) * 5); width: calc((100% - 5 * var(--gutter)) / 3 + var(--gutter)); margin-left: auto; margin-right: auto; display: flex; align-items: center; justify-content: center; gap: var(--bl); border: 0; font: inherit; color: var(--ink); cursor: pointer; }
.g-tab:hover, .g-side.open .g-tab { --fill: var(--block-active); }
.g-side .w-menu { left: 50%; transform: translateX(-50%); bottom: calc(var(--bl) * 6); }
.g-side.open .w-menu { display: flex; }
@media (max-width: 760px) {
  .glyphs { grid-template-rows: 45% 1fr; row-gap: var(--bl); height: calc(100svh - var(--bl) * 6); }
  .g-side { grid-column: 1 / -1; grid-row: 1; }
  .g-list { grid-column: 1 / -1; grid-row: 2; grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* DESCARGA: ficha (blanca) + botón DOWNLOAD (6 col × 23 cada uno) */
.dl { margin-top: var(--bl); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); }
.dl-info { grid-column: 1 / span 6; height: calc(var(--bl) * 23); display: grid; grid-template-rows: repeat(23, var(--bl)); padding: 0 calc(var(--bl) * 2); }
.dl-info .d-name { grid-row: 4 / span 4; }
.dl-info .d-credit { grid-row: 13 / span 6; }
.dl-btn { grid-column: 7 / span 6; height: calc(var(--bl) * 23); display: flex; align-items: center; justify-content: center; color: var(--ink); text-decoration: none; }
.dl-btn:hover { --fill: var(--block-active); }
.dl-btn .t03 { height: calc(var(--bl) * 4); --lh: calc(var(--bl) * 4); }
.links { margin-top: var(--bl); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); }

<script>
(() => {
  const BL = 10.186;
  const LOGO_RATIO = 163.1 / 1491.628;
  let MAX_BTN = 23;                    // alto máximo de un botón, en líneas (5 dentro de una tipografía)
  const STEPS = [5, 11, 23];           // alturas del sistema (2·n + 1)

  const body = document.body;
  const area = document.getElementById('area');
  const bar = document.getElementById('bar');
  const buttons = document.getElementById('buttons');
  const stateName = document.getElementById('stateName');
  const root = document.documentElement;

  // Catálogo: mismo orden, texto y tamaño (pt = px) que tu página 3
  // ---------- Tipografías (más adelante: una carpeta por tipografía) ----------
  // Página de cada tipografía: datos reales de content/fonts/<carpeta>/info.js
  const TYPEFACES = {
    'nano':        { family: 'Kallpa' },
    'interstice':  { family: 'Interstice' },
    'ranger':      { family: 'Ranger' },
    'cameno':      { family: 'Cameno' },
    'keta':        { family: 'Keta' },
    'blockz':      { family: 'Blockz' },
    'green-pulse': { family: 'Green Pulse' },
  };
  // Tipografías guardadas pero ocultas: sus archivos y datos siguen en content/fonts/.
  // Para volver a mostrar una, quítala de esta lista.
  const HIDDEN = ['green-pulse'];
  for (const k of HIDDEN) delete TYPEFACES[k];
  const CATALOGUE = ['interstice', 'nano', 'blockz', 'cameno', 'keta', 'ranger', 'green-pulse'].filter(k => !HIDDEN.includes(k));
  const idOf = family => Object.keys(TYPEFACES).find(k => TYPEFACES[k].family === family);

  // [familia, texto, tamaño]
  // una tarjeta por tipografía, sin repetir
  const FONTS = [
    ['Kallpa', 'Aa', 400], ['Interstice', 'aa', 300], ['Ranger', 'Aa', 300],
    ['Cameno', 'Aa', 317], ['Keta', 'aa', 398], ['Blockz', 'AA', 272],
    ['Green Pulse', 'AA', 300],
  ].filter(([family]) => idOf(family));
  const content = document.getElementById('content');
  FONTS.forEach(([family, text, size]) => {
    const c = document.createElement('a');
    c.className = 'card block'; c.href = '#' + idOf(family); c.dataset.id = idOf(family);
    c.setAttribute('aria-label', family);
    const s = document.createElement('span');
    s.className = 'specimen'; s.textContent = text;
    s.style.fontFamily = `"${family}"`; s.style.setProperty('--s', size);
    c.appendChild(s); content.appendChild(c);
  });

  // ---------- Misma línea base en todas las tarjetas ----------
  // No se toca ninguna fuente: se mide dónde cae la línea base de cada una
  // (con una marca invisible apoyada en ella) y cuánto baja el dibujo de las
  // letras por debajo de esa línea (hay fuentes que lo traen desplazado).
  // Luego se mueve el texto entero para que el pie de todas las letras
  // apoye a 4 líneas del borde inferior de la tarjeta.
  const BASE_FROM_BOTTOM = 4;
  // dibuja el texto en un lienzo oculto y busca el último píxel con tinta
  const cnv = document.createElement('canvas'), ctx = cnv.getContext('2d', { willReadFrequently: true });
  function inkBelowBaseline(sp) {
    const cs = getComputedStyle(sp), fs = parseFloat(cs.fontSize), text = sp.firstChild.textContent;
    const W = Math.ceil(fs * text.length * 1.6), H = Math.ceil(fs * 2), base = Math.round(fs * 1.2);
    cnv.width = W; cnv.height = H;
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#000';
    ctx.fillText(text, fs * .2, base);
    const px = ctx.getImageData(0, 0, W, H).data;
    for (let y = H - 1; y > 0; y--) {
      for (let x = 0; x < W; x++) if (px[(y * W + x) * 4 + 3] > 128) return Math.max(0, y + 1 - base);
    }
    return 0;
  }
  // tarjetas siempre cuadradas: el alto sigue al ancho, en líneas base enteras (mínimo 47)
  function sizeCards() {
    const c = [...document.querySelectorAll('.card')].find(x => x.offsetParent && !x.classList.contains('zoom'));
    if (!c) return;
    document.documentElement.style.setProperty('--card-h', Math.max(47, Math.round(c.getBoundingClientRect().width / BL)) * BL + 'px');
  }
  function alignBaselines() {
    sizeCards();
    document.querySelectorAll('.card .specimen').forEach(sp => {
      if (!sp.offsetParent) return;
      sp.style.setProperty('--shift', '0px');
      let probe = sp.querySelector('.probe');
      if (!probe) { probe = document.createElement('i'); probe.className = 'probe'; probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline'; sp.appendChild(probe); }
      const baseline = probe.getBoundingClientRect().top;
      const target = sp.parentElement.getBoundingClientRect().bottom - BASE_FROM_BOTTOM * BL - inkBelowBaseline(sp);
      sp.style.setProperty('--shift', (target - baseline) + 'px');
    });
  }

  // ---------- Medidas que dependen del ancho ----------
  let rows = 1, logoLines = 16, states = [];
  const perRow = () => parseInt(getComputedStyle(buttons).getPropertyValue('--per-row')) || 6;

  function measure() {
    rows = Math.ceil(6 / perRow());
    const w = buttons.getBoundingClientRect().width;
    // el logo ocupa todo el ancho y su caja se redondea a líneas enteras
    logoLines = Math.max(3, Math.round((w * LOGO_RATIO) / BL));
    root.style.setProperty('--logo-h', (w * LOGO_RATIO) + 'px');
    // estados, en líneas: oculto · compacto · medio · grande · con logo
    const btnBlock = h => rows * (h + 1);
    // dentro de una tipografía (tu página 4): oculto · compacto · logo + botones pequeños
    if (['is-type', 'is-res', 'is-bld', 'is-pg'].some(c => body.classList.contains(c))) {
      MAX_BTN = 5;
      states = [
        { name: 'OCULTO',   lines: 0 },
        { name: 'COMPACTO', lines: btnBlock(5) },
        { name: 'CON LOGO', lines: btnBlock(5) + logoLines + 1 },
      ];
      return;
    }
    MAX_BTN = 23;
    states = [
      { name: 'OCULTO',   lines: 0 },
      { name: 'COMPACTO', lines: btnBlock(5) },
      { name: 'MEDIO',    lines: btnBlock(11) },
      { name: 'GRANDE',   lines: btnBlock(23) },
      { name: 'CON LOGO', lines: btnBlock(23) + logoLines + 1 },
    ];
  }

  // ---------- Pinta el menú para una altura dada (en líneas) ----------
  let shown = 0;                          // altura que se ve ahora mismo (en líneas)
  function render(lines) {
    shown = lines;
    const maxBtnZone = rows * (MAX_BTN + 1);
    const btnZone = Math.min(lines, maxBtnZone);
    // alto de cada botón: continuo mientras se mueve; en reposo cae en líneas enteras
    let h = btnZone / rows - 1;
    h = Math.max(1, Math.min(MAX_BTN, h));
    const logoZone = Math.max(0, lines - maxBtnZone);           // lo que sobra es para el logo
    const logoGap = Math.min(1, logoZone);
    root.style.setProperty('--btn-h', (h * BL) + 'px');
    root.style.setProperty('--logo-visible', (Math.max(0, logoZone - logoGap) * BL) + 'px');
    root.style.setProperty('--logo-gap', (logoGap * BL) + 'px');
    area.style.setProperty('--area', (lines * BL) + 'px');
    root.style.setProperty('--header-h', ((lines + 3) * BL) + 'px');
    area.setAttribute('aria-hidden', lines === 0 ? 'true' : 'false');
    buttons.querySelectorAll('a').forEach(a => a.tabIndex = lines === 0 ? -1 : 0);
  }

  let current = 4;                       // empieza CON LOGO (la animación de entrada va en el paso 3)
  // Todas las transiciones se animan con la misma curva suave
  const ease = t => t < .5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2;
  let anim = null;
  function animateTo(to, ms, done) {
    cancelAnimationFrame(anim);
    const from = shown, t0 = performance.now();
    if (ms <= 0 || from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) { render(to); done && done(); return; }
    const step = now => {
      const t = Math.min(1, (now - t0) / ms);
      render(from + (to - from) * ease(t));
      if (t < 1) anim = requestAnimationFrame(step); else { anim = null; done && done(); }
    };
    anim = requestAnimationFrame(step);
  }
  function go(i, ms = 325) {
    current = Math.max(0, Math.min(states.length - 1, i));
    stateName.textContent = states[current].name;
    animateTo(states[current].lines, ms);
  }
  const nearest = lines => states.reduce((best, s, i) =>
    Math.abs(s.lines - lines) < Math.abs(states[best].lines - lines) ? i : best, 0);

  // ---------- Arrastrar la barra ----------
  let drag = null;
  // ---------- Intro: se ve con logo y a los 2 s se pliega ----------
  const INTRO_WAIT = 1000, INTRO_DURATION = 800, INTRO_TARGET = 1;   // 1 = COMPACTO (tu página 3)
  let introTimer = null;
  function cancelIntro() { clearTimeout(introTimer); introTimer = null; }
  function playIntro() { introTimer = setTimeout(() => go(INTRO_TARGET, INTRO_DURATION), INTRO_WAIT); }
  // si tocas la barra antes de tiempo, la intro se cancela y mandas tú
  bar.addEventListener('pointerdown', cancelIntro, true);
  bar.addEventListener('keydown', cancelIntro, true);

  bar.addEventListener('pointerdown', e => {
    bar.setPointerCapture(e.pointerId);
    cancelAnimationFrame(anim);
    drag = { y: e.clientY, start: shown, lines: shown, moved: false };
  });
  bar.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dy) < 4) return;
    drag.moved = true;
    body.classList.add('dragging');
    const max = states[states.length - 1].lines;
    drag.lines = Math.max(0, Math.min(max, drag.start + dy / BL));
    render(drag.lines);
    stateName.textContent = states[nearest(drag.lines)].name;
  });
  const end = () => {
    if (!drag) return;
    if (drag.moved) go(nearest(drag.lines));
    else go(current === 0 ? 1 : 0);      // un clic: pliega / despliega
    body.classList.remove('dragging');
    drag = null;
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', end);
  // teclado: flechas para subir/bajar de estado, Intro para plegar/desplegar
  bar.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); go(current + 1); peek(); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); go(current - 1); peek(); }
  });
  bar.addEventListener('click', e => { if (e.detail === 0) go(current === 0 ? 1 : 0); }); // Intro/espacio
  let peekT;
  function peek() { body.classList.add('peek'); clearTimeout(peekT); peekT = setTimeout(() => body.classList.remove('peek'), 900); }

  // ---------- Botón activo (sección en la que estás) ----------
  buttons.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    if (a.getAttribute('href').startsWith('mailto:')) return;   // SUBMIT: abre el correo
    e.preventDefault();

  function placeSmileysIn(wrap, cardSel = '.card', blockSel = '.card, .footer .block') {
    wrap.querySelectorAll('.smiley').forEach(n => n.remove());
    if (!wrap.offsetParent) return;
    const base = wrap.getBoundingClientRect();
    const blocks = [...wrap.querySelectorAll(blockSel)].map(b => b.getBoundingClientRect());

    const seen = new Set();
    // un cruce existe donde una tarjeta tiene otro bloque a su derecha y otro debajo
    cards.forEach(r => {
      const x = r.right + BL / 2, y = r.bottom + BL / 2;
      const right = blocks.some(o => Math.abs(o.left - r.right - BL) < 2 && o.top <= r.bottom && o.bottom >= r.top);
      const below = blocks.some(o => Math.abs(o.top - r.bottom - BL) < 2 && o.left <= r.right && o.right >= r.left);
      if (!right || !below) return;
      const key = Math.round(x) + ',' + Math.round(y);
      if (seen.has(key)) return; seen.add(key);
      const d = document.createElement('div');
      d.className = 'smiley'; d.innerHTML = SMILEY;

  document.addEventListener('click', e => {
    const card = e.target.closest('.card'); if (!card || card.classList.contains('zoom')) return;
    e.preventDefault();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { location.hash = card.dataset.id; return; }
    const r = card.getBoundingClientRect();
    const z = card.cloneNode(true);
    z.classList.add('zoom'); z.removeAttribute('href');
    Object.assign(z.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    body.appendChild(z);
    go(0, 500);
    z.offsetWidth;
    const W = document.documentElement.clientWidth;
    Object.assign(z.style, { left: BL + 'px', top: 5 * BL + 'px', width: (W - 2 * BL) + 'px', height: (innerHeight - 6 * BL) + 'px' });
    z.querySelector('.specimen').style.opacity = 0;
    setTimeout(() => { location.hash = card.dataset.id; setTimeout(() => z.remove(), 60); }, 520);
  });

  // Arranque: si llegas con #tipografía entras directo; si no, intro de la home
  if (TYPEFACES[decodeURIComponent(location.hash.slice(1))] || location.hash === '#resources' || location.hash === '#builder' || location.hash === '#playground') route(0);
  else document.fonts.ready.then(playIntro);
  document.fonts.ready.then(() => { alignBaselines(); placeSmileys(); }); placeSmileys();
  // se recolocan si cambia el ancho (también cuando aparece la barra de scroll)
  new ResizeObserver(placeSmileys).observe(wrap);
  addEventListener('resize', () => {
    alignBaselines(); placeSmileys(); if (body.classList.contains('is-type')) fitHero();
    const name = states[current].name;
    measure();
    current = Math.max(0, states.findIndex(s => s.name === name));
    cancelAnimationFrame(anim); render(states[current].lines);
  });
})();
</script>
<script src="assets/js/sound.js"></script>
</body>
